# Local stand-in for Supabase (Postgres + PostgREST) used by the API end-to-end tests. Never used in production.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: e2e
    ports: ["54330:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.8
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:e2e@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: e2e-jwt-secret-at-least-32-characters-long
    ports: ["54331:3000"]
    profiles: ["rest"]
