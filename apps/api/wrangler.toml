name = "moma-api"
main = "src/entrypoints/http.ts"
compatibility_date = "2026-11-01"
# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY, BOOTSTRAP_SECRET, OWNER_EMAIL
routes = [{ pattern = "moma-api.superaicore.indevs.in", custom_domain = true }]

[vars]
SUPABASE_URL = "https://dedjaugwvhipnxbwxaav.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RamavXHPtMcVAwC6PswQWQ_wZPBdXol"

# Smart reminders, daily/weekly/monthly reviews and budget alerts (scheduled() in src/entrypoints/http.ts).
[triggers]
crons = ["*/15 * * * *"]

# Receipt / transfer pictures attached to transactions (migration 013). Never public; served by /v1/attachments/:id.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "moma-attachments"
